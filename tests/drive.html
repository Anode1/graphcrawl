<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>graphcrawl drive</title>
<link rel="stylesheet" href="graphcrawl.css">

<!-- A driven copy of demo.html for the headless screenshot: after the first
     tree is up it double-clicks "father", lets it glide to the centre and
     expand, then hovers "grandmother(father)" for the wrapped label. Served
     over the embedded files with GRAPHCRAWL_WEB=tests (tests/shot.sh). -->
<div id="applet">
  <canvas id="graph"></canvas>
  <div id="tools">
    <label>Tree Depth <select id="depth"><option>2</option><option>3</option></select></label>
    <label>History <select id="history"></select></label>
  </div>
  <div id="status"></div>
</div>
<iframe name="content" src="about:blank"></iframe>

<script>
window.GRAPHCRAWL_PARAMS = {
  first_node: "0", delay_ms: "1000", iconFromX: "30", iconFromY: "30",
  ovals_min_id: "-600", ovals_max_id: "-214",
  category_icon_1: "minus.gif", category_icon_2: "exclaim.gif", category_icon_3: "external.gif",
  category_icon_4: "plus.gif", category_icon_5: "query.gif",
  number_of_frames_in_anim: "2", file_1: "server1.gif", file_2: "server2.gif",
  line_0:  "0;Anode;0;;;1,2",
  line_1:  "1;father;0;;0;3,4",
  line_2:  "2;mother;0;;0;5,6",
  line_3:  "3;grandmother(father);0;;1;7,8",
  line_4:  "4;grandfather(father);0;;1;9,10",
  line_5:  "5;grandmother(mother);0;;2;11,12",
  line_6:  "6;grandfather(mother);4;;2;13,14",
  line_7:  "7;grandgrandfather1;1;;3;15,16",
  line_8:  "8;grandgrandmother2;2;;3;17,18",
  line_9:  "9;grandgrandfather3;3;;4;19,20",
  line_10: "10;grandgrandmother4;3;;4;21,22"
};
window.addEventListener('DOMContentLoaded', function () {
  var log = [];
  var status = document.getElementById('status');
  function say(s) { log.push(s); status.textContent = log.join(' | '); }
  setTimeout(function () {
    var gv = window.graphcrawl.getGraphView();
    var nv = gv.getNode('1');
    if (!nv) { say('no father in view'); return; }
    var x = nv.getMiddleX(), y = nv.getMiddleY();
    gv.mouseDown(false, x, y); gv.mouseUp(false, x, y);
    gv.mouseDown(false, x, y); gv.mouseUp(false, x, y);     /* within 300 ms: a double click */
    say('dblclick father, state=' + gv.getState());
  }, 2500);
  setTimeout(function () {
    var gv = window.graphcrawl.getGraphView();
    say('central=' + gv.getCentralNode().nodeModel.label + ' nodes=' + gv.nodes.elements().length +
        ' at ' + gv.getCentralNode().getMiddleX() + ',' + gv.getCentralNode().getMiddleY());
    var nv = gv.getNode('3');
    if (nv) gv.mouseMove(false, nv.getMiddleX(), nv.getMiddleY());
  }, 6000);
});
</script>
<script src="graphcrawl.js"></script>
</html>
