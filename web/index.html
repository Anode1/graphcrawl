<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>graphcrawl</title>
<link rel="stylesheet" href="graphcrawl.css">

<!-- frames.html of 1999: the applet on the left, the "content" frame on the
     right where a node's URL opens -->
<div id="applet">
  <canvas id="graph"></canvas>
  <div id="tools">
    <label>Nodes <select id="limit"></select></label>
    <label>Depth <select id="depth"></select></label>
    <label>History <select id="history"></select></label>
    <button id="back" title="the previous node">Back</button>
    <label>Go to id <input id="goto" size="10"></label>
    <label>Find <input id="find" size="14" placeholder="label text"></label>
    <span id="hint">double-click a node to crawl to it; Alt or Ctrl with it opens the node where it stands. Green: everything around it is on screen, blue: more there. Drag a node, drag the background to pan, wheel to zoom, hover for the full label, Shift keeps the content frame</span>
  </div>
  <ul id="results" hidden></ul>
  <div id="status"></div>
</div>
<!-- no allow-same-origin: a node's page gets an opaque origin and cannot
     reach this one, whatever the graph file put in its url field -->
<iframe name="content" src="about:blank" sandbox="allow-scripts allow-popups allow-forms"></iframe>

<script>
/* the <param> block of 1999. first_node comes from #id in the URL or from
 * /api/info when absent. */
window.GRAPHCRAWL_PARAMS = {
  cgi: "/api/node",
  static_version: "false",
  iconFromX: "30",
  iconFromY: "30",
  ovals_min_id: "-600",
  ovals_max_id: "-214",
  category_icon_1: "minus.gif",
  category_icon_2: "exclaim.gif",
  category_icon_3: "external.gif",
  category_icon_4: "plus.gif",
  category_icon_5: "query.gif",
  number_of_frames_in_anim: "2",
  file_1: "server1.gif",
  file_2: "server2.gif"
};
</script>
<script src="graphcrawl.js"></script>
</html>
